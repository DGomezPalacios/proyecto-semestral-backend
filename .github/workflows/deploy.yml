name: CI/CD — Build & Push Backend

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push — Despachos
        uses: docker/build-push-action@v5
        with:
          context: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          file: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile
          push: true
          tags: |
            dgomezpalacios/proyecto-semestral-backend:latest
            dgomezpalacios/proyecto-semestral-backend:${{ github.sha }}
          cache-from: type=gha,scope=despachos
          cache-to: type=gha,mode=max,scope=despachos

      - name: Build y Push — Ventas
        uses: docker/build-push-action@v5
        with:
          context: back-Ventas_SpringBoot/Springboot-API-REST
          file: back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile
          push: true
          tags: |
            dgomezpalacios/proyecto-semestral-ventas:latest
            dgomezpalacios/proyecto-semestral-ventas:${{ github.sha }}
          cache-from: type=gha,scope=ventas
          cache-to: type=gha,mode=max,scope=ventas
